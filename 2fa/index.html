<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة المصادقة الثنائية (2FA) | مجموعة متاجرنا</title>
    <!-- مكتبة التشفير الأساسية (مهمة لعمليات 2FA) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- قسم الشعارات الجديد --- */
        .brands-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
            padding-bottom: 25px;
        }

        .brand-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            height: 60px;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .brand-name {
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* -------------------------- */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14.5px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            color: #e2e8f0;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 15px;
        }

        .secret-input {
            width: 100%;
            background: #0f172a;
            border: 2px solid #334155;
            color: #fff;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            text-align: left;
            direction: ltr;
            letter-spacing: 1px;
        }

        .secret-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            margin-bottom: 25px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }

        /* منطقة عرض الرمز */
        .result-area {
            display: none; 
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .code-display {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .timer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .time-text {
            color: #94a3b8;
            font-size: 15px;
        }

        .time-badge {
            background: #334155;
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 100%;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .btn-copy {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover {
            background: #1d4ed8;
        }
        
        .btn-copy.success {
            background: #10b981;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* --- قسم الدعم الفني --- */
        .support-section {
            text-align: center;
            padding-top: 25px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            margin-top: 25px;
        }

        .support-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .support-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .telegram-btn-support {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #229ED9;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 36px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(34, 158, 217, 0.4);
            transition: all 0.3s ease;
            direction: ltr;
        }

        .telegram-btn-support:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(34, 158, 217, 0.6);
            background: #2bb3f3;
        }

        .telegram-btn-support svg {
            width: 22px;
            height: 22px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- قسم الشعارات -->
        <div class="brands-container">
            <div class="brand-item">
                <!-- استخدام ../ لسحب الصورة من الملف الرئيسي -->
                <img src="../9a908a4b-668e-4fc8-8718-a8818453410e.jpeg" alt="Elevaraa" class="brand-logo" onerror="this.style.display='none'">
                <span class="brand-name">إليفارا</span>
            </div>
            <div class="brand-item">
                <img src="../e609dc1a-c899-4d45-8724-8bedeb033422.jpeg" alt="BoxUp" class="brand-logo" onerror="this.style.display='none'">
                <span class="brand-name">بوكس أب</span>
            </div>
        </div>

        <div class="header">
            <h1>بوابة المصادقة الثنائية (2FA)</h1>
            <p>بوابة آمنة وموثوقة لاستخراج رموز التحقق الخاصة بحساباتك الرقمية في ثوانٍ معدودة.</p>
        </div>

        <div class="input-group">
            <label class="input-label">أدخل المفتاح السري (Secret Key):</label>
            <input type="text" id="secretKey" class="secret-input" placeholder="مثال: J7O7TSRNL5MXBL..." autocomplete="off">
            <div id="errorMsg" class="error-msg">المفتاح غير صحيح، يرجى التأكد من الرمز.</div>
        </div>

        <button class="btn-generate" onclick="startTotp()">استخراج الرمز الآن 🚀</button>

        <div class="result-area" id="resultArea">
            <div class="code-display" id="totpCode">------</div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="timer-container">
                <span class="time-text">ينتهي الرمز خلال:</span>
                <span class="time-badge"><span id="timeRemaining">30</span> ثانية</span>
            </div>

            <button class="btn-copy" id="copyBtn" onclick="copyCode()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span id="copyText">نسخ الرمز</span>
            </button>
        </div>

        <!-- قسم الدعم الفني -->
        <div class="support-section">
            <div class="support-title">لو احتجت لأي مساعدة؟</div>
            <div class="support-subtitle">الرجاء التواصل مع فريق الدعم في تيلجرام</div>
            <a href="https://t.me/elevaraa" target="_blank" class="telegram-btn-support">
                <span>@elevaraa</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </a>
        </div>

    </div>

    <script>
        let totpInterval;
        let currentCode = "";

        function base32tohex(base32) {
            const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            let hex = "";
            
            base32 = base32.replace(/\s+/g, '').toUpperCase();
            
            for (let i = 0; i < base32.length; i++) {
                let val = base32chars.indexOf(base32.charAt(i));
                if (val === -1) throw new Error("Invalid base32");
                bits += val.toString(2).padStart(5, '0');
            }
            for (let i = 0; i + 4 <= bits.length; i += 4) {
                let chunk = bits.substr(i, 4);
                hex = hex + parseInt(chunk, 2).toString(16);
            }
            return hex;
        }

        function getTOTP(secret) {
            try {
                const keyHex = base32tohex(secret);
                const key = CryptoJS.enc.Hex.parse(keyHex);
                const epoch = Math.round(new Date().getTime() / 1000.0);
                const time = Math.floor(epoch / 30);
                const timeHex = time.toString(16).padStart(16, '0');
                const timeBytes = CryptoJS.enc.Hex.parse(timeHex);
                
                const hmac = CryptoJS.HmacSHA1(timeBytes, key);
                const hmacHex = hmac.toString(CryptoJS.enc.Hex);
                
                const offset = parseInt(hmacHex.substring(hmacHex.length - 1), 16);
                let otp = (parseInt(hmacHex.substr(offset * 2, 8), 16) & 0x7fffffff) + "";
                return otp.substr(otp.length - 6, 6).padStart(6, '0');
            } catch (e) {
                return null;
            }
        }

        function startTotp() {
            const secret = document.getElementById('secretKey').value;
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            
            if (!secret) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'الرجاء إدخال المفتاح أولاً!';
                resultArea.style.display = 'none';
                return;
            }

            const initialCode = getTOTP(secret);
            if (!initialCode) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'المفتاح غير صحيح، يرجى التأكد من النسخ الصحيح.';
                resultArea.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';
            resultArea.style.display = 'block';
            
            updateDisplay(secret);
            
            if (totpInterval) clearInterval(totpInterval);
            totpInterval = setInterval(() => updateDisplay(secret), 1000);
        }

        function updateDisplay(secret) {
            const code = getTOTP(secret);
            const epoch = Math.round(new Date().getTime() / 1000.0);
            const remaining = 30 - (epoch % 30);
            
            currentCode = code;
            document.getElementById('totpCode').textContent = code;
            document.getElementById('timeRemaining').textContent = remaining;
            
            const progressFill = document.getElementById('progressFill');
            const percentage = (remaining / 30) * 100;
            progressFill.style.width = percentage + '%';
            
            if (remaining <= 5) {
                progressFill.style.backgroundColor = '#ef4444'; 
            } else if (remaining <= 10) {
                progressFill.style.backgroundColor = '#f59e0b'; 
            } else {
                progressFill.style.backgroundColor = '#38bdf8'; 
            }
        }

        function copyCode() {
            if (!currentCode) return;
            navigator.clipboard.writeText(currentCode).then(() => {
                const btn = document.getElementById('copyBtn');
                const text = document.getElementById('copyText');
                
                btn.classList.add('success');
                text.textContent = 'تم النسخ بنجاح! ✓';
                
                setTimeout(() => {
                    btn.classList.remove('success');
                    text.textContent = 'نسخ الرمز';
                }, 2000);
            });
        }
    </script>
</body>
</html>
