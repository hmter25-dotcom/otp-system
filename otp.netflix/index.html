<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة استلام الأكواد | مجموعة متاجرنا</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        /* الشعارات */
        .brands-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .brand-logo {
            height: 60px;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* البطاقات */
        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* خطوط ملونة بجانب كل بطاقة للتمييز */
        .card-email { border-right: 4px solid #6366f1; }
        .card-signin { border-right: 4px solid #38bdf8; }
        .card-temp { border-right: 4px solid #f59e0b; }
        .card-login { border-right: 4px solid #10b981; }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 17px;
            font-weight: 700;
        }
        
        .card-email .card-header { color: #818cf8; }
        .card-signin .card-header { color: #38bdf8; }
        .card-temp .card-header { color: #fbd38d; }
        .card-login .card-header { color: #6ee7b7; }

        /* منطقة الإيميل */
        .email-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #fff;
            direction: ltr;
        }

        /* خانات الأكواد */
        .code-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            direction: ltr;
        }

        .code-box {
            width: 50px;
            height: 60px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 800;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .code-box.active {
            color: #fff;
            border-color: currentColor;
            box-shadow: 0 0 15px currentColor;
        }

        /* أزرار النسخ */
        .copy-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; }
        
        .btn-gray { background: #475569; }
        .btn-gray:hover { background: #334155; }

        .btn-success { background: #10b981 !important; }

        .loader-text {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

    <!-- الشعارات -->
    <div class="brands-container">
        <img src="../9a908a4b-668e-4fc8-8718-a8818453410e.jpeg" alt="Elevaraa" class="brand-logo" onerror="this.style.display='none'">
        <img src="../e609dc1a-c899-4d45-8724-8bedeb033422.jpeg" alt="BoxUp" class="brand-logo" onerror="this.style.display='none'">
    </div>

    <div class="container">

        <!-- 1. بطاقة الإيميل -->
        <div class="card card-email">
            <div class="card-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                بيانات الحساب (Email)
            </div>
            <div class="email-box">
                <span id="emailDisplay">جاري جلب الإيميل...</span>
            </div>
        </div>

        <!-- 2. رمز تسجيل الدخول (4 أرقام) -->
        <div class="card card-signin">
            <div class="card-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                رمز الدخول (Sign-In Code)
            </div>
            <div class="loader-text" id="status-signin">بانتظار الرمز...</div>
            <div class="code-container" id="container-signin">
                <div class="code-box">-</div><div class="code-box">-</div><div class="code-box">-</div><div class="code-box">-</div>
            </div>
            <button class="copy-btn btn-blue" onclick="copyCode('signin', this)">نسخ الرمز</button>
        </div>

        <!-- 3. الرمز المؤقت (4 أرقام) -->
        <div class="card card-temp">
            <div class="card-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                رمز مؤقت (Temporary Code)
            </div>
            <div class="loader-text" id="status-temp">بانتظار الرمز...</div>
            <div class="code-container" id="container-temp">
                <div class="code-box">-</div><div class="code-box">-</div><div class="code-box">-</div><div class="code-box">-</div>
            </div>
            <button class="copy-btn btn-gray" onclick="copyCode('temp', this)">نسخ الرمز</button>
        </div>

        <!-- 4. رمز التحقق (6 أرقام) -->
        <div class="card card-login">
            <div class="card-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                رمز التحقق (Login Verification)
            </div>
            <div class="loader-text" id="status-login">بانتظار الرمز...</div>
            <div class="code-container" id="container-login">
                <div class="code-box">-</div><div class="code-box">-</div><div class="code-box">-</div>
                <div class="code-box">-</div><div class="code-box">-</div><div class="code-box">-</div>
            </div>
            <button class="copy-btn btn-gray" onclick="copyCode('login', this)">نسخ الرمز</button>
        </div>

    </div>

    <script>
        // هنا سيتم وضع الرابط الخاص بالسيرفر الوسيط (البايثون) لاحقاً
        const API_URL = "سيرفرنا_الوسيط_بيكون_هنا"; 

        // بيانات وهمية مؤقتة لاختبار شكل الصفحة (بنحذفها بعد ربط السيرفر)
        let codes = { signin: "", temp: "", login: "" };

        function updateCodeDisplay(type, code, length, colorClass) {
            const container = document.getElementById(`container-${type}`);
            const status = document.getElementById(`status-${type}`);
            
            if(code && code.length === length) {
                codes[type] = code;
                status.style.display = 'none';
                container.innerHTML = '';
                for(let i=0; i<length; i++) {
                    container.innerHTML += `<div class="code-box active" style="color:${colorClass}; border-color:${colorClass}">${code[i]}</div>`;
                }
            }
        }

        function copyCode(type, btnElement) {
            if(!codes[type]) return;
            navigator.clipboard.writeText(codes[type]).then(() => {
                const originalText = btnElement.innerText;
                const originalBg = btnElement.className;
                
                btnElement.className = "copy-btn btn-success";
                btnElement.innerText = "تم النسخ ✓";
                
                setTimeout(() => {
                    btnElement.className = originalBg;
                    btnElement.innerText = originalText;
                }, 2000);
            });
        }

        // --- كود تجريبي لاختبار الواجهة ---
        // سيتم استبداله بدالة Fetch لجلب البيانات الحقيقية من السيرفر
        setTimeout(() => {
            document.getElementById('emailDisplay').innerText = "zmediase@ostories.net";
            updateCodeDisplay('signin', '1234', 4, '#38bdf8');
            updateCodeDisplay('temp', '5678', 4, '#fbd38d');
            updateCodeDisplay('login', '987654', 6, '#6ee7b7');
        }, 2000);
    </script>
</body>
</html>
