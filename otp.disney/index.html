<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة ديزني+ | مجموعة متاجرنا</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #001233 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 25px;
        }

        /* إضافة لمسة ألوان ديزني الزرقاء */
        .logo-area h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 14.5px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }

        .input-label {
            display: block;
            color: #e2e8f0;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 15px;
        }

        .email-input {
            width: 100%;
            background: #0f172a;
            border: 2px solid #334155;
            color: #fff;
            padding: 18px 16px;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            text-align: left;
            direction: ltr;
        }

        .email-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
        }

        .btn-generate:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* رسائل الخطأ والنجاح */
        .message-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            animation: fadeIn 0.4s ease;
        }

        .msg-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .result-area {
            display: none;
            margin-top: 25px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px 20px;
            animation: fadeIn 0.4s ease;
        }

        .code-display {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            font-family: monospace;
            direction: ltr;
        }

        .btn-copy {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-copy:hover {
            background: #059669;
        }

        /* أنيميشن التحميل */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .support-link {
            display: block;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .support-link:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>دخول ديزني+</h1>
            <p>أدخل الإيميل الخاص بطلبك لاستخراج رمز الدخول الآمن.</p>
        </div>

        <div class="input-group">
            <label class="input-label">الإيميل (Email):</label>
            <input type="email" id="customerEmail" class="email-input" placeholder="elevaraa11+12345@gmail.com">
        </div>

        <button class="btn-generate" id="fetchBtn" onclick="getCode()">
            <span id="btnText">جلب رمز الدخول</span>
            <div class="spinner" id="spinner"></div>
        </button>

        <div id="errorBox" class="message-box msg-error"></div>

        <div id="resultArea" class="result-area">
            <p style="color: #94a3b8; margin-bottom: 10px; font-size: 14px;">رمز الدخول الخاص بك:</p>
            <div class="code-display" id="disneyCode">------</div>
            <button class="btn-copy" id="copyBtn" onclick="copyCode()">نسخ الرمز</button>
        </div>

        <a href="https://t.me/elevaraa" target="_blank" class="support-link">تواجه مشكلة؟ تواصل مع الدعم الفني</a>
    </div>

    <script>
        // رابط السيرفر الخاص بك على Render (استخرجته من صورك السابقة)
        const API_URL = "https://otp-system-gfa0.onrender.com/get-disney";

        async function getCode() {
            const emailInput = document.getElementById('customerEmail').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultArea = document.getElementById('resultArea');
            const fetchBtn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            // إخفاء النتائج السابقة
            errorBox.style.display = 'none';
            resultArea.style.display = 'none';

            if (!emailInput) {
                showError("الرجاء إدخال الإيميل أولاً.");
                return;
            }

            if (!emailInput.includes("elevaraa11+")) {
                showError("تأكد من إدخال الإيميل الصحيح الذي استلمته مع الطلب.");
                return;
            }

            // تشغيل حالة التحميل
            fetchBtn.disabled = true;
            btnText.textContent = "جاري فحص الإيميل...";
            spinner.style.display = "block";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });

                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById('disneyCode').textContent = data.code;
                    resultArea.style.display = 'block';
                } else {
                    showError(data.message || "حدث خطأ غير معروف.");
                }
            } catch (error) {
                showError("تعذر الاتصال بالسيرفر. الرجاء المحاولة بعد قليل.");
            } finally {
                // إيقاف حالة التحميل
                fetchBtn.disabled = false;
                btnText.textContent = "جلب رمز الدخول";
                spinner.style.display = "none";
            }
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function copyCode() {
            const code = document.getElementById('disneyCode').textContent;
            const btn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(code).then(() => {
                btn.textContent = "تم النسخ بنجاح! ✓";
                btn.style.background = "#059669";
                setTimeout(() => {
                    btn.textContent = "نسخ الرمز";
                    btn.style.background = "#10b981";
                }, 2000);
            }).catch(() => {
                showError("حدث خطأ أثناء النسخ.");
            });
        }
    </script>
</body>
</html>
