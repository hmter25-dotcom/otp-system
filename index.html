<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - الصفحة الرئيسية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 15px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            text-align: center; 
            border: 1px solid #e5e7eb;
        }
        .email-label { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .email-box { background: #f0f2f5; padding: 12px; border-radius: 8px; font-size: 14px; color: #555; border: 1px solid #e5e7eb; }
        .title { font-size: 16px; font-weight: bold; color: #1a56db; margin-bottom: 15px; }
        .title.green { color: #057a55; }
        .code-display { font-size: 32px; font-weight: bold; letter-spacing: 12px; margin-bottom: 10px; color: #111; }
        .status { font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>

    <!-- قسم الإيميل الأساسي -->
    <div class="card">
        <div class="email-label">Account Email 📧</div>
        <div class="email-box">elevaraa76@outlook.com</div>
    </div>

    <!-- قسم الـ 4 خانات (تم إيقاف سحب OSN منه) -->
    <div class="card" style="background-color: #f0f7ff;">
        <div class="title">رمز التحقق (4 خانات) 🛡️</div>
        <div class="code-display">- - - -</div>
        <div class="status">تم إيقاف السحب من هنا (مخصص الآن لصفحة OSN فقط)</div>
    </div>

    <!-- قسم الـ 6 خانات -->
    <div class="card" style="background-color: #f3faf7;">
        <div class="title green">رمز التحقق (6 خانات) 🛡️</div>
        <div class="code-display">- - - - - -</div>
        <div class="status">في انتظار الكود...</div>
    </div>

    <script>
        // تم مسح كود الـ (fetch) من هذه الصفحة نهائياً 
        // الآن هذه الصفحة أصبحت مجرد شكل ولن تسرق أو تسحب أكواد OSN أبداً
        console.log("تم إيقاف الاتصال بسيرفر Render من الصفحة الرئيسية لمنع التداخل.");
    </script>

</body>
</html>
