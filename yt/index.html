<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>إدارة روابط يوتيوب | Elevaraa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        :focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
        .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
        @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .toast { animation: toastIn .25s ease; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="text-gray-800">

    <!-- شاشة الدخول -->
    <div id="loginScreen" class="flex min-h-screen items-center justify-center p-4">
        <form id="loginForm" class="glass-panel p-8 rounded-xl shadow-lg w-full max-w-sm text-center border border-gray-100" novalidate>
            <h2 class="text-2xl font-bold text-gray-800 mb-6"><i class="fas fa-shield-alt text-red-600 ml-2" aria-hidden="true"></i>الإدارة المركزية</h2>
            <label for="adminPassword" class="sr-only">رمز الدخول السري</label>
            <input type="password" id="adminPassword" placeholder="رمز الدخول السري" autocomplete="current-password" class="w-full p-3 border rounded-lg mb-3 text-center outline-none focus:ring-2 focus:ring-red-500">
            <label class="flex items-center justify-center gap-2 text-sm text-gray-600 mb-4 cursor-pointer select-none">
                <input type="checkbox" id="rememberMe" checked class="accent-red-600">
                تذكرني على هذا الجهاز (7 أيام)
            </label>
            <button type="submit" id="loginBtn" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow-lg disabled:opacity-60 disabled:cursor-not-allowed">تسجيل الدخول</button>
            <p id="loginError" role="alert" class="text-red-500 text-sm mt-3 hidden"></p>
            <p id="loginHint" class="text-gray-400 text-xs mt-3 hidden">قد يستغرق الاتصال حتى دقيقة إذا كان السيرفر في وضع السكون...</p>
        </form>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardScreen" class="hidden min-h-screen">
        <nav class="bg-gray-900 text-white p-4 shadow-md">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold"><i class="fab fa-youtube text-red-500 ml-2" aria-hidden="true"></i>موزع يوتيوب بريميوم</h1>
                <button type="button" id="logoutBtn" class="text-sm bg-gray-700 px-4 py-2 rounded text-white hover:bg-gray-600 transition">تسجيل الخروج</button>
            </div>
        </nav>

        <main class="container mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="h-fit space-y-6">
                <div class="glass-panel p-6 rounded-xl shadow border border-gray-100">
                    <h3 class="text-lg font-bold mb-4 border-b pb-2">توليد روابط جديدة</h3>
                    <label for="linkCount" class="block text-sm text-gray-600 mb-2">العدد المطلوب (1 إلى 50):</label>
                    <input type="number" id="linkCount" value="1" min="1" max="50" step="1" inputmode="numeric" class="w-full p-3 border rounded-lg mb-4 outline-none focus:ring-2 focus:ring-red-500">
                    <button type="button" id="generateBtn" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg flex justify-center items-center hover:bg-red-700 transition shadow-md disabled:opacity-60 disabled:cursor-not-allowed">
                        <i class="fas fa-magic ml-2" aria-hidden="true"></i> توليد الروابط
                    </button>
                </div>

                <div id="newLinksPanel" class="glass-panel p-6 rounded-xl shadow border border-gray-100 hidden">
                    <div class="flex justify-between items-center mb-3 border-b pb-2">
                        <h3 class="text-lg font-bold">الروابط الجديدة</h3>
                        <button type="button" id="copyNewBtn" class="text-blue-600 hover:text-blue-800 transition text-sm"><i class="far fa-copy ml-1" aria-hidden="true"></i>نسخ الكل</button>
                    </div>
                    <label for="newLinksText" class="sr-only">الروابط الجديدة</label>
                    <textarea id="newLinksText" readonly rows="5" dir="ltr" class="w-full p-3 border rounded-lg text-xs font-mono text-gray-600 bg-gray-50 outline-none"></textarea>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-xl shadow border border-gray-100 md:col-span-2">
                <div class="flex flex-wrap justify-between items-start gap-2 mb-4 border-b pb-3">
                    <div>
                        <h3 class="text-lg font-bold">الروابط المُصدرة <span id="domainTag" dir="ltr" class="hidden text-xs font-mono font-normal bg-gray-100 text-gray-600 px-2 py-1 rounded align-middle"></span></h3>
                        <p id="statsText" class="text-xs text-gray-500 mt-1" aria-live="polite"></p>
                        <p id="updatedText" class="text-xs text-gray-400 mt-0.5"></p>
                    </div>
                    <div class="flex items-center gap-4 text-sm">
                        <button type="button" id="copyActiveBtn" class="text-blue-600 hover:text-blue-800 transition"><i class="far fa-copy ml-1" aria-hidden="true"></i>نسخ الروابط النشطة</button>
                        <button type="button" id="refreshBtn" class="text-blue-600 hover:text-blue-800 transition disabled:opacity-60"><i class="fas fa-sync-alt ml-1" id="refreshIcon" aria-hidden="true"></i>تحديث القائمة</button>
                    </div>
                </div>

                <div class="flex gap-2 mb-4" role="group" aria-label="تصفية الروابط">
                    <button type="button" data-filter="all" aria-pressed="true" class="filter-btn px-3 py-1 rounded-full text-xs font-bold border">الكل</button>
                    <button type="button" data-filter="active" aria-pressed="false" class="filter-btn px-3 py-1 rounded-full text-xs font-bold border">نشط</button>
                    <button type="button" data-filter="used" aria-pressed="false" class="filter-btn px-3 py-1 rounded-full text-xs font-bold border">محروق</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-right">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm">
                                <th class="p-3" scope="col">الحالة</th>
                                <th class="p-3" scope="col">الرابط</th>
                                <th class="p-3 text-center" scope="col">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="linksTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="toasts" class="fixed bottom-4 left-4 right-4 sm:right-auto sm:w-80 space-y-2 z-50" role="status" aria-live="polite"></div>

<script>
(() => {
    'use strict';

    const API_URL = 'https://otp-system-gfa0.onrender.com';
    const REQUEST_TIMEOUT_MS = 45000;          // يتحمل بدء تشغيل Render البارد
    const AUTO_REFRESH_MS = 30000;             // تحديث تلقائي هادئ للقائمة
    const IDLE_LOGOUT_MS = 15 * 60 * 1000;     // خروج تلقائي (فقط إذا لم يُفعّل "تذكرني")
    const SESSION_TTL_MS = 7 * 24 * 60 * 60 * 1000;
    const SESSION_KEY = 'ytAdminSession';
    const LEGACY_KEY = 'ytAdminPass';          // مفتاح النسخة القديمة (يُرحَّل تلقائياً)
    const MIN_COUNT = 1;
    const MAX_COUNT = 50;

    const $ = (id) => document.getElementById(id);
    const els = {
        loginScreen: $('loginScreen'), dashboard: $('dashboardScreen'),
        loginForm: $('loginForm'), password: $('adminPassword'), remember: $('rememberMe'),
        loginBtn: $('loginBtn'), loginError: $('loginError'), loginHint: $('loginHint'),
        logoutBtn: $('logoutBtn'), count: $('linkCount'), generateBtn: $('generateBtn'),
        refreshBtn: $('refreshBtn'), refreshIcon: $('refreshIcon'),
        stats: $('statsText'), updated: $('updatedText'), domainTag: $('domainTag'),
        tbody: $('linksTableBody'), copyActive: $('copyActiveBtn'),
        newPanel: $('newLinksPanel'), newText: $('newLinksText'), copyNew: $('copyNewBtn'),
        toasts: $('toasts'),
    };
    const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));

    // كلمة المرور في الذاكرة أثناء الجلسة. التخزين الدائم اختياري عبر "تذكرني".
    let adminPass = '';
    let remembered = false;
    let loading = false;
    let idleTimer = null;
    let autoTimer = null;
    let allLinks = [];
    let activeFilter = 'all';

    const GENERATE_LABEL = '<i class="fas fa-magic ml-2" aria-hidden="true"></i> توليد الروابط';
    const FILTER_ON = ['bg-red-600', 'text-white', 'border-red-600'];
    const FILTER_OFF = ['bg-white', 'text-gray-600', 'border-gray-300', 'hover:bg-gray-50'];

    // ---------- التخزين ----------
    const store = {
        get(key) { try { return localStorage.getItem(key); } catch { return null; } },
        set(key, value) { try { localStorage.setItem(key, value); return true; } catch { return false; } },
        del(key) { try { localStorage.removeItem(key); } catch { /* ignore */ } },
    };

    function readSession() {
        const raw = store.get(SESSION_KEY);
        if (raw) {
            try {
                const s = JSON.parse(raw);
                if (s && typeof s.p === 'string' && s.p && Number(s.exp) > Date.now()) return s.p;
            } catch { /* تالف */ }
            store.del(SESSION_KEY);
        }
        return store.get(LEGACY_KEY) || '';
    }

    function saveSession(pass) {
        store.set(SESSION_KEY, JSON.stringify({ p: pass, exp: Date.now() + SESSION_TTL_MS }));
        store.del(LEGACY_KEY);
    }

    function clearSession() {
        store.del(SESSION_KEY);
        store.del(LEGACY_KEY);
    }

    // ---------- أدوات ----------
    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    function toast(message, type = 'info') {
        const colors = { info: 'bg-gray-900', success: 'bg-green-600', error: 'bg-red-600' };
        const node = el('div', `toast ${colors[type] || colors.info} text-white text-sm px-4 py-3 rounded-lg shadow-lg`, message);
        els.toasts.appendChild(node);
        setTimeout(() => node.remove(), 3500);
    }

    function isHttpsUrl(value) {
        try { return new URL(value).protocol === 'https:'; } catch { return false; }
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            ta.remove();
            return ok;
        }
    }

    // ---------- الاتصال بالـ API ----------
    class ApiError extends Error {
        constructor(kind) { super(kind); this.kind = kind; }
    }

    const ERROR_MESSAGES = {
        unauthorized: 'رمز المرور غير صحيح!',
        rate: 'محاولات كثيرة، انتظر بضع دقائق ثم حاول مرة أخرى.',
        unconfigured: 'لوحة الإدارة غير مفعّلة على السيرفر.',
        network: 'تعذر الاتصال بالسيرفر، تأكد من الإنترنت وحاول مرة أخرى.',
        server: 'حدث خطأ في الخادم، حاول مرة أخرى.',
    };

    async function api(path, payload = {}) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
        let res;
        try {
            res = await fetch(`${API_URL}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass, ...payload }),
                cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer',
                signal: ctrl.signal,
            });
        } catch {
            throw new ApiError('network');
        } finally {
            clearTimeout(timer);
        }
        if (res.status === 401) throw new ApiError('unauthorized');
        if (res.status === 429) throw new ApiError('rate');
        if (res.status === 503) throw new ApiError('unconfigured');
        let body = null;
        try { body = await res.json(); } catch { /* ignore */ }
        if (!res.ok || !body || body.status !== 'success') throw new ApiError('server');
        return body;
    }

    // ---------- الجلسة والشاشات ----------
    function showLoginError(message) {
        els.loginError.textContent = message;
        els.loginError.classList.toggle('hidden', !message);
    }

    function setLoginBusy(busy, label) {
        els.loginBtn.disabled = busy;
        els.loginBtn.textContent = busy ? label : 'تسجيل الدخول';
        els.loginHint.classList.toggle('hidden', !busy);
    }

    function armIdleTimer() {
        clearTimeout(idleTimer);
        if (!adminPass || remembered) return;
        idleTimer = setTimeout(() => logout('تم تسجيل الخروج تلقائياً لعدم النشاط.'), IDLE_LOGOUT_MS);
    }

    function startAutoRefresh() {
        clearInterval(autoTimer);
        autoTimer = setInterval(() => {
            if (adminPass && !document.hidden && !loading) refreshList({ silent: true });
        }, AUTO_REFRESH_MS);
    }

    function showDashboard() {
        els.loginScreen.classList.add('hidden');
        els.dashboard.classList.remove('hidden');
        armIdleTimer();
        startAutoRefresh();
    }

    function logout(reason) {
        adminPass = '';
        remembered = false;
        allLinks = [];
        clearSession();
        clearTimeout(idleTimer);
        clearInterval(autoTimer);
        els.dashboard.classList.add('hidden');
        els.loginScreen.classList.remove('hidden');
        els.password.value = '';
        els.tbody.replaceChildren();
        els.stats.textContent = '';
        els.updated.textContent = '';
        els.domainTag.classList.add('hidden');
        els.newText.value = '';
        els.newPanel.classList.add('hidden');
        showLoginError('');
        setLoginBusy(false);
        if (reason) toast(reason, 'info');
        els.password.focus();
    }

    function handleApiFailure(err, { silent = false } = {}) {
        if (err.kind === 'unauthorized' && adminPass) {
            logout('انتهت الجلسة أو تغيّر الرمز، سجّل الدخول من جديد.');
            return;
        }
        if (!silent) toast(ERROR_MESSAGES[err.kind] || ERROR_MESSAGES.server, 'error');
    }

    // ---------- عرض الروابط ----------
    function setFilter(next) {
        activeFilter = next;
        filterButtons.forEach((btn) => {
            const on = btn.dataset.filter === next;
            btn.setAttribute('aria-pressed', String(on));
            btn.classList.remove(...FILTER_ON, ...FILTER_OFF);
            btn.classList.add(...(on ? FILTER_ON : FILTER_OFF));
        });
        renderLinks();
    }

    function buildRow(link) {
        const used = Boolean(link.used);
        const url = typeof link.url === 'string' ? link.url : '';
        const tr = el('tr', 'border-b last:border-0 hover:bg-gray-50 transition');

        const statusTd = el('td', 'p-3');
        const badge = el('span', used
            ? 'bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold'
            : 'bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold');
        const badgeIcon = el('i', `fas ${used ? 'fa-burn' : 'fa-check-circle'} ml-1`);
        badgeIcon.setAttribute('aria-hidden', 'true');
        badge.append(badgeIcon, used ? 'محروق' : 'نشط');
        statusTd.appendChild(badge);

        const urlTd = el('td', 'p-3 text-sm font-mono text-gray-500 break-all', url);
        urlTd.dir = 'ltr';

        const actionTd = el('td', 'p-3 text-center');
        if (used) {
            actionTd.appendChild(el('span', 'text-gray-400 text-sm', 'مُستخدم'));
        } else if (isHttpsUrl(url)) {
            const btn = el('button', 'text-blue-500 hover:bg-blue-50 p-2 rounded transition');
            btn.type = 'button';
            btn.setAttribute('aria-label', 'نسخ الرابط');
            const icon = el('i', 'far fa-copy');
            icon.setAttribute('aria-hidden', 'true');
            btn.appendChild(icon);
            btn.addEventListener('click', async () => {
                const ok = await copyText(url);
                icon.className = ok ? 'fas fa-check text-green-500' : 'fas fa-exclamation-triangle text-red-500';
                if (!ok) toast('تعذر النسخ، يرجى نسخه يدوياً', 'error');
                setTimeout(() => { icon.className = 'far fa-copy'; }, 2000);
            });
            actionTd.appendChild(btn);
        } else {
            actionTd.appendChild(el('span', 'text-gray-400 text-sm', 'غير صالح'));
        }

        tr.append(statusTd, urlTd, actionTd);
        return tr;
    }

    function emptyRow(message) {
        const tr = el('tr');
        const td = el('td', 'p-4 text-center text-gray-500', message);
        td.colSpan = 3;
        tr.appendChild(td);
        return tr;
    }

    function updateMeta() {
        const active = allLinks.filter((l) => !l.used).length;
        els.stats.textContent = allLinks.length
            ? `نشط: ${active} | محروق: ${allLinks.length - active} (آخر ${allLinks.length} رابط)`
            : '';
        els.updated.textContent = `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;

        // النطاق يُستخرج من الروابط نفسها بدل كتابته يدوياً في الصفحة
        const sample = allLinks.map((l) => l.url).find(isHttpsUrl);
        if (sample) {
            els.domainTag.textContent = new URL(sample).hostname;
            els.domainTag.classList.remove('hidden');
        } else {
            els.domainTag.classList.add('hidden');
        }
    }

    function renderLinks() {
        els.tbody.replaceChildren();
        if (!allLinks.length) {
            els.tbody.appendChild(emptyRow('لا توجد روابط مُصدرة بعد.'));
            return;
        }
        const visible = allLinks.filter((l) =>
            activeFilter === 'all' || (activeFilter === 'used' ? l.used : !l.used));
        if (!visible.length) {
            els.tbody.appendChild(emptyRow('لا توجد روابط في هذا التصنيف.'));
            return;
        }
        const fragment = document.createDocumentFragment();
        visible.forEach((link) => fragment.appendChild(buildRow(link)));
        els.tbody.appendChild(fragment);
    }

    async function fetchLinks() {
        const body = await api('/admin/youtube/list');
        allLinks = (Array.isArray(body.links) ? body.links : [])
            .filter((l) => l && typeof l === 'object');
        updateMeta();
        renderLinks();
    }

    async function refreshList({ silent = false } = {}) {
        if (loading) return;
        loading = true;
        if (!silent) {
            els.refreshBtn.disabled = true;
            els.refreshIcon.classList.add('fa-spin');
        }
        try {
            await fetchLinks();
        } catch (err) {
            handleApiFailure(err, { silent });
        } finally {
            loading = false;
            els.refreshBtn.disabled = false;
            els.refreshIcon.classList.remove('fa-spin');
        }
    }

    // ---------- الإجراءات ----------
    async function attemptLogin(pass, { restoring = false } = {}) {
        if (loading) return;
        loading = true;
        adminPass = pass;
        showLoginError('');
        setLoginBusy(true, restoring ? 'جاري استعادة الجلسة...' : 'جاري التحقق...');
        try {
            await fetchLinks();
            remembered = els.remember.checked;
            if (remembered) saveSession(pass); else clearSession();
            els.password.value = '';
            showDashboard();
        } catch (err) {
            adminPass = '';
            if (err.kind === 'unauthorized') clearSession();   // الرمز المحفوظ لم يعد صالحاً
            // عند فشل الشبكة نُبقي الجلسة المحفوظة لتعمل إعادة المحاولة
            showLoginError(restoring && err.kind === 'network'
                ? 'تعذر استعادة الجلسة بسبب الاتصال. اضغط تسجيل الدخول لإعادة المحاولة.'
                : (ERROR_MESSAGES[err.kind] || ERROR_MESSAGES.server));
        } finally {
            loading = false;
            setLoginBusy(false);
        }
    }

    function handleLogin(event) {
        event.preventDefault();
        const typed = els.password.value;
        const pass = typed || readSession();   // الحقل الفارغ يعيد استخدام الجلسة المحفوظة
        if (!pass) return showLoginError('أدخل رمز الدخول.');
        attemptLogin(pass, { restoring: !typed });
    }

    async function handleGenerate() {
        if (loading) return;
        const raw = Number(els.count.value);
        if (!Number.isInteger(raw) || raw < MIN_COUNT || raw > MAX_COUNT) {
            toast(`أدخل عدداً صحيحاً بين ${MIN_COUNT} و${MAX_COUNT}.`, 'error');
            els.count.focus();
            return;
        }
        loading = true;
        els.generateBtn.disabled = true;
        els.generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2" aria-hidden="true"></i> جاري التوليد...';
        try {
            const body = await api('/admin/youtube/generate_bulk', { count: raw });
            const links = (Array.isArray(body.links) ? body.links : []).filter(isHttpsUrl);
            els.newText.value = links.join('\n');
            els.newPanel.classList.toggle('hidden', links.length === 0);
            toast(`تم توليد ${links.length} رابط.`, 'success');
            await fetchLinks();
        } catch (err) {
            handleApiFailure(err);
        } finally {
            loading = false;
            els.generateBtn.disabled = false;
            els.generateBtn.innerHTML = GENERATE_LABEL;
        }
    }

    async function handleCopyNew() {
        const ok = await copyText(els.newText.value);
        toast(ok ? 'تم نسخ كل الروابط.' : 'تعذر النسخ، يرجى نسخها يدوياً', ok ? 'success' : 'error');
    }

    async function handleCopyActive() {
        const urls = allLinks.filter((l) => !l.used && isHttpsUrl(l.url)).map((l) => l.url);
        if (!urls.length) return toast('لا توجد روابط نشطة للنسخ.', 'info');
        const ok = await copyText(urls.join('\n'));
        toast(ok ? `تم نسخ ${urls.length} رابط نشط.` : 'تعذر النسخ', ok ? 'success' : 'error');
    }

    // ---------- الربط ----------
    els.loginForm.addEventListener('submit', handleLogin);
    els.logoutBtn.addEventListener('click', () => logout());
    els.generateBtn.addEventListener('click', handleGenerate);
    els.refreshBtn.addEventListener('click', () => refreshList());
    els.copyNew.addEventListener('click', handleCopyNew);
    els.copyActive.addEventListener('click', handleCopyActive);
    filterButtons.forEach((btn) => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));
    ['click', 'keydown', 'touchstart'].forEach((evt) =>
        document.addEventListener(evt, armIdleTimer, { passive: true }));

    // تسجيل الخروج من تبويب آخر ينعكس هنا
    window.addEventListener('storage', (e) => {
        if (e.key === SESSION_KEY && e.newValue === null && adminPass) {
            logout('تم تسجيل الخروج من تبويب آخر.');
        }
    });

    // تحديث فوري عند العودة للتبويب
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && adminPass && !loading) refreshList({ silent: true });
    });

    setFilter('all');

    // استعادة الجلسة المحفوظة تلقائياً
    const saved = readSession();
    if (saved) {
        els.remember.checked = true;
        attemptLogin(saved, { restoring: true });
    } else {
        els.password.focus();
    }
})();
</script>
</body>
</html>
